services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: jutjubic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-1:
    build: .
    ports:
      - "8081:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/jutjubic
      - DB_USERNAME=postgres
      - DB_PASSWORD=root
      - RABBITMQ_HOST=rabbitmq
      - MAIL_PASSWORD=${MAIL_PASSWORD:-dummy}
      - SITE_BASE_URL=http://localhost:8080/api/auth
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 40s

  app-2:
    build: .
    ports:
      - "8082:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/jutjubic
      - DB_USERNAME=postgres
      - DB_PASSWORD=root
      - RABBITMQ_HOST=rabbitmq
      - MAIL_PASSWORD=${MAIL_PASSWORD:-dummy}
      - SITE_BASE_URL=http://localhost:8080/api/auth
    volumes:
      - uploads:/app/uploads
    depends_on:
      app-1:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
