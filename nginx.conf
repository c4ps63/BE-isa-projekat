events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend_cluster {
        # PROMENA 1: Smanjili smo max_fails na 1.
        # Ako jednom ne uspe, odmah ga oznaci kao mrtvog na 10 sekundi.
        server backend-1:8080 max_fails=1 fail_timeout=10s;
        server backend-2:8080 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        client_max_body_size 205M;

        location /api {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # PROMENA 2: Agresivni timeout-i za failover
            # Ako ne moze da uspostavi vezu za 1 sekundu, prebaci na sledeci server.
            proxy_connect_timeout 1s;

            # Ako server prihvati vezu ali ne posalje odgovor za 2 sekunde, prebaci dalje.
            # (Pazi: za teske upite ovo moze biti premalo, ali za metadata videa je ok)
            proxy_read_timeout 300s; # Ostavi duze za citanje (zbog uploada)
            proxy_send_timeout 300s; # Ostavi duze za slanje (zbog uploada)

            # PROMENA 3: Eksplicitno reci kada da proba sledeci server
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
        }

        # Health check endpoint
        location /actuator {
            proxy_pass http://backend_cluster;
            # I ovde zelimo brz failover
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /uploads/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 1s; # Brz failover i za staticke stranice ako ih servira java
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}