# Server config
spring.application.name=isabackend
server.port=8080

# PostgreSQL configuration

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/jutjubic?connectTimeout=2&socketTimeout=2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cache
spring.cache.type=jcache
spring.cache.jcache.config=classpath:ehcache.xml

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File upload limits
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Upload folder
file.upload-dir=uploads
server.tomcat.max-swallow-size=-1


spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# MailSender
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=jutjubicvpl@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000


# --- MONITORING KONFIGURACIJA ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=JutjubicApp
management.health.mail.enabled=false

#Test videos
app.db.init-bulk-data=false

# Actuator Health Check (za Docker/Nginx proveru)
management.endpoint.health.show-details=always


# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# Transcoding parametri (predefinisani)
transcoding.output-format=mp4
transcoding.resolution=720

# URL APLIKACIJE
site.base.url=${SITE_BASE_URL:http://localhost:8080/api/auth}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

