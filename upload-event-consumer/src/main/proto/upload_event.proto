syntax = "proto3";

package rs.ac.ftn.isa.isabackend.proto;

option java_package = "rs.ac.ftn.isa.isabackend.proto";
option java_outer_classname = "UploadEventProto";

message UploadEvent {
    int64 video_id = 1;
    string title = 2;
    string file_name = 3;
    int64 file_size_bytes = 4;
    string author_username = 5;
    string upload_timestamp = 6;
    string video_format = 7;
    string location = 8;
    double latitude = 9;
    double longitude = 10;
    int32 duration_seconds = 11;
    string description = 12;
}
